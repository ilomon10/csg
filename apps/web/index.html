<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types csg-worker-url"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Sprite Generator</title>
    <!-- Theme and reduce-motion before first paint: external, so the CSP needs no inline script. -->
    <script src="/theme-boot.js"></script>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/shared/ui/fonts/figtree-latin-500-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/shared/ui/fonts/figtree-latin-600-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/shared/ui/fonts/pixelify-sans-latin-600-normal.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

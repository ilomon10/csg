name: Update goldens

# Manual only. Regenerates golden PNGs in the pinned canonical container and uploads them as an
# artifact. Nothing is committed: a maintainer downloads the artifact, copies the files into
# packages/engine/test/goldens/, and commits them with the reason.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the goldens change (logged in the job output; not stored in the repo, so put it in the commit message)
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    env:
      CSG_GOLDEN_ENV: canonical
      CSG_GOLDEN_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm goldens:update
        env:
          # Passed via env, never interpolated into the script (no shell injection from the input).
          CSG_GOLDEN_REASON: ${{ inputs.reason }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updated-goldens
          path: |
            packages/engine/test/goldens/**
            test-results/goldens/**
          if-no-files-found: warn

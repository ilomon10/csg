name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm docs:shortcuts --check
      - run: pnpm typecheck
      # Build before test: tools/web-build.test.ts checks the built apps/web/dist (bundle size,
      # lazy engine chunk, no test hosts) and FAILS in CI when dist is missing.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm spec:check
      - run: pnpm spec:immutability

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @csg/site build

  # E2E runs in the same pinned Playwright image as the GPU tests: the bare runner has no GPU and
  # its SwiftShader WebGPU path draws nothing, while the image renders (playwright.config.ts pins
  # the SwiftShader adapter when CI is set). Keep the digest in sync with gpu-tests below.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image ships node 24, corepack and the Playwright browsers, but not pnpm.
      - run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  # Canonical GPU tests (REQ-PIX-028): software rasterizer inside the pinned Playwright image, both
  # backends. CSG_GOLDEN_ENV=canonical makes the harness FAIL (never skip) on a wrong backend/adapter.
  # Keep the image in sync with scripts/golden-env/run.sh and the exact @playwright/test version.
  gpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    env:
      CSG_GOLDEN_ENV: canonical
      CSG_GOLDEN_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image ships node 24 and corepack but not pnpm; the version comes from package.json.
      - run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:gpu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gpu-test-results
          path: |
            test-results/goldens/**
            test-results/perf/**
          if-no-files-found: ignore
